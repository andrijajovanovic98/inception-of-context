services:
  ioc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ioc-app
    # Host network: required on campus Linux so the container can reach
    # Ollama on 127.0.0.1:11435 (bridge + host.docker.internal is refused).
    network_mode: host
    volumes:
      # Mount demo_app so autonomous patches reflect on the host filesystem
      - ./demo_app:/app/demo_app
      # Persist ChromaDB across container restarts
      - /tmp/ioc/chroma_db:/tmp/ioc/chroma_db
      # NOTE: /tmp/ioc/hf-cache is deliberately NOT mounted. The embedding
      # weights are baked into the image, so `make up` works on a clean machine
      # and `make clean` (which wipes the host cache) cannot break the container.
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://127.0.0.1:11435
      - HF_HOME=/tmp/ioc/hf-cache
      - TRANSFORMERS_CACHE=/tmp/ioc/hf-cache
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      [
        "python3",
        "bonus/index.py",
        "demo_app",
        "--dashboard",
        "--watch",
        "--host",
        "127.0.0.1",
        "--port",
        "8000",
        "--db-dir",
        "/tmp/ioc/chroma_db",
        "--ollama-host",
        "127.0.0.1:11435",
      ]
    restart: unless-stopped
