[mypy]
python_version = 3.10
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
warn_unused_ignores = False
pretty = True
show_error_codes = True
no_implicit_optional = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-watchdog.*]
ignore_missing_imports = True
